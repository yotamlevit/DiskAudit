[package]
name = "diskaudit"
version = "1.0.0"
description = "Read-only disk usage visualizer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "diskaudit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tokio = { version = "1", features = ["macros", "time", "rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jwalk = "0.8"
dashmap = "6.1"
parking_lot = "0.12"
# Duplicate-detection pass only: content hashing (read-only) + parallel I/O.
blake3 = "1"
rayon = "1"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"

# NOTE: no `panic = "abort"` here. The scan runs on a blocking thread wrapped
# in catch_unwind (lib.rs); with abort, any panic in the scanner would kill
# the whole app instead of surfacing as a recoverable error.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
incremental = false

[profile.dev]
opt-level = 1
debug = 1
incremental = true
