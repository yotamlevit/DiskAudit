[package]
name = "diskaudit-core"
version = "1.2.0"
description = "DiskAudit's read-only scanner, store and reclaim detector (no UI dependencies)"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jwalk = "0.8"
dashmap = "6.1"
parking_lot = "0.12"
# Duplicate-detection pass only: content hashing (read-only) + parallel I/O.
blake3 = "1"
rayon = "1"

# Allocation size + file identity on NTFS (see src/platform/windows.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
